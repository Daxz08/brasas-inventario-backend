# Server
server.port=${PORT:8080}
server.address=0.0.0.0

# Database
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:brasas_inventario}?sslMode=VERIFY_CA&trustCertificateKeyStoreUrl=classpath:ca.pem&trustCertificateKeyStoreType=PEM&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# JWT
jwt.secret=${JWT_SECRET:BrasasDelCentro2026ClaveSecretaJWTInventarioPolleriaLosOlivosLimaPeruSegura}
jwt.expiration=7200000

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html