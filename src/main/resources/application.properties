# Server
server.port=${PORT:8080}
server.address=0.0.0.0

# Database
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:brasas_inventario}?sslMode=REQUIRED&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# SSL / Truststore
spring.ssl.bundle.jks.aiven.truststore.location=classpath:truststore.jks
spring.ssl.bundle.jks.aiven.truststore.password=changeit
spring.ssl.bundle.jks.aiven.truststore.type=JKS

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# JWT
jwt.secret=${JWT_SECRET:BrasasDelCentro2026ClaveSecretaJWTInventarioPolleriaLosOlivosLimaPeruSegura}
jwt.expiration=7200000

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html

# Brevo (correo)
brevo.api-key=${BREVO_API_KEY:}
brevo.sender-email=${BREVO_SENDER_EMAIL:noreply@brasasdelcentro.pe}
brevo.sender-name=Brasas del Centro