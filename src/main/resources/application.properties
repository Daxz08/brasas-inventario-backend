# Configuración del servidor
server.port=${PORT:8080}

# Base de datos - se leen de variables de entorno en Render
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Deshabilitar open-in-view para evitar warnings
spring.jpa.open-in-view=false

# JWT - se lee de variable de entorno
jwt.secret=${JWT_SECRET}
jwt.expiration=7200000

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html